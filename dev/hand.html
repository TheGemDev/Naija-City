<!doctype html>
<html><head><meta charset="utf-8" /><title>Hand preview</title>
<style>
html,body,#root{margin:0;height:100%;background:#cfe3ef;font:12px system-ui}
.stage{position:absolute;left:200px;top:40px}
.rig{position:relative;width:340px;height:680px;transform:rotate(-3deg)}
.phone{position:absolute;inset:0;z-index:1;border-radius:44px;background:#111;padding:12px;box-sizing:border-box}
.screen{width:100%;height:100%;border-radius:34px;background:linear-gradient(#1e3a8a,#0f766e)}
.hand{position:absolute;left:-90px;bottom:-200px;width:520px;height:560px;pointer-events:none;overflow:visible}
.hand-back{z-index:0;filter:drop-shadow(0 20px 30px rgba(0,0,0,.3))}
.hand-thumb{z-index:2}
</style></head>
<body><div id="root"></div><script type="module" src="./hand.tsx"></script></body></html>
